<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="web2.css" />
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <script src="https://kit.fontawesome.com/996973c893.js"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700;800&family=Roboto+Slab:wght@200;400;600;900&display=swap" rel="stylesheet" />
</head>
<body>
    <section id="social-media" class="container-fluid">
        <div class="container text-white py-5">
            <h4 class="text-warning">Social Media</h4>
            <h1 class="m-heading">Let's be friends</h1>
            
            <div class="row pt-5">
                <div class="col-3 media link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pk-2 text-white">LinkedIn</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa fa-linkedin fa-2x text-secondary"></i>
                        </div>
                    </div>
                </div>

                <div class="col-3 media link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">GitHub</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa fa-github fa-2x text-secondary"></i>
                        </div>
                    </div>
                </div>

                <div class="col-3 media link btn">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-white">YouTube</h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa fa-youtube fa-2x text-secondary"></i>
                        </div>
                    </div>
           </div>

                <div class="col-3 media link btn bg-warning">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h3 class="m-0 pt-2 text-dark">
                                <a href="https://www.youtube.com/watch?v=8wof_hJ-14M">Email</a>
                            </h3>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa fa-envelope fa-2x text-secondary"></i>
                            <a href="https://www.youtube.com/watch?v=8wof_hJ-14M" target="blank"></a>
                        </div>
                    </div>
                </div>
            </div>

        
    </section>
</body>
</html>
