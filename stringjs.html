<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    


    <h2>The string methods in JavaScript</h2>

    <p>The string methods can convert a number to a string.</p>


    <p id="number_result"></p>
    <p id="string_result"> </p>

<script>

    var x = 45;
    var y =54;


    document.getElementById("number_result").innerHTML = x + y;
    document.getElementById("string_result").innerHTML = String(x) + String(y);


    </script>
</body>


</body>
</html>
