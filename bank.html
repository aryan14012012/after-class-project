<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Withdrawal page </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <link rel="stylesheet" href="bank.css">
</head>
<body>
    <header class="navigation">
    <div class="container-fluid">
      <div class="row align-items-center">
        <div class="col-md-6 d-flex align-items-center">
          <i class="fa fa-bank fa-2x text-warning"></i>
          <span class="ml-3 h5 mb-0 text-white"> 🏦Bank </span>
        </div>
        <div class="col-md-6 d-flex justify-content-end align-items-center">
          <nav class="nav justify-content-md-end justify-content-center align-items-center flex-wrap gap-2">
            <a href="#menu" class="nav-link text-white">Personal</a>
            <a href="#menu" class="nav-link text-white">Corporate</a>
            <a href="#gallery" class="nav-link text-white">International</a>
            <a href="#contact" class="nav-link text-white">Contact</a>

            <form action="/search-results-page" method="get" class="search-form">
              <label for="site-search" class="visually-hidden">Search site content</label>
              <input type="search" id="site-search" name="q" placeholder="Search..." required>
              <button type="submit">🔍</button>
            </form>
          </nav>
        </div>
      </div>
    </div>
  </header>


  
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="balance-box">
                    <h5 class="mb-2">Available Balance</h5>
                    <h2 class="mb-0">$0,000.00</h2>
                </div>

                <div class="card">
                    <div class="card-header  text-white text-center">
                        <h3>Bank Withdrawal page</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="accountNumber" class="form-label">Account Number</label>
                                <input type="text" class="form-control" id="accountNumber" 
                                       placeholder="Enter account number">
                            </div>

                            <div class="mb-3">
                                <label for="withdrawAmount" class="form-label">Withdrawal Amount</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" class="form-control" id="withdrawAmount" 
                                           placeholder="Enter amount" min="1">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="pin" class="form-label">PIN</label>
                                <input type="password" class="form-control" id="pin" 
                                       placeholder="Enter 4-digit PIN" maxlength="4">
                            </div>

                            <div class="d-grid gap-2">
                                <button type="button" class="btn btn-primary btn-lg" onclick="alert('You don\'t have any bank account 😂😂😂🤣')">Withdraw</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous">
    </script>
</body>
</html>
