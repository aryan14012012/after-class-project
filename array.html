<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>javascript arry</title>
</head>
<body>
    

    <h2>My Array</h2>
    <p>Click the button to sort the array in ascending order:</p>

    <button onclick="ascending()">Ascending</button>
    <button onclick="descending()">Descending</button>



    <p id="result"></p>

    <P id="product_value"> </P>


    <script>
        var number = [543, 2, 9, 1, 5, 600, 4];

        document.getElementById("result").innerHTML = number;


        function ascending(){
            number.sort(function(a, b)
            {return a - b});


            document.getElementById("result").innerHTML = number;
        }
        function descending(){
            number.sort(function(a, b)
            {return b - a});
            document.getElementById("result").innerHTML = number;
        }
         function myfunction(num){
            return num * 10;
         }

         var newarray = number.map(myfunction); 

         document.getElementById("product_value").innerHTML = newarray;
        

    </script>
</body>
</html>
